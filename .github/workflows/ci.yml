name: C++ CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  lint:
    name: Lint / Format / Static Analysis
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install Lizard
      run: pip install lizard

    - name: Run Lizard (Code Complexity)
      run: |
        lizard src/ headers/ \
          -w \
          --CCN 15 \
          --length 100 \
          --arguments 10 \
          --exclude "*/Dependencies/*"

    - name: Run cpp-linter (clang-format + clang-tidy)
      uses: cpp-linter/cpp-linter-action@v2
      with:
        style: llvm
        tidy-checks: '*'
        version: 20
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Cross-platform build & test. Independent from the lint job so a style
  # warning never hides a platform-specific build failure.
  build_and_test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux / GCC / Debug + coverage
            os: ubuntu-latest
            build_type: Debug
            cc: gcc
            cxx: g++
            coverage: true
          - name: Linux / Clang / Release
            os: ubuntu-latest
            build_type: Release
            cc: clang
            cxx: clang++
          - name: Windows / MSVC / Debug
            os: windows-latest
            build_type: Debug
          - name: Windows / MSVC / Release
            os: windows-latest
            build_type: Release
          - name: Windows / MinGW-w64 GCC / Release
            os: windows-latest
            build_type: Release
            mingw: true
            shell: msys2 {0}
          - name: macOS / AppleClang / Release
            os: macos-latest
            build_type: Release
    defaults:
      run:
        shell: ${{ matrix.shell || 'bash' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libglfw3-dev libgl1-mesa-dev xvfb gcovr

      - name: Install Dependencies (MinGW)
        if: matrix.mingw
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja

      - name: Install Dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install glfw

      - name: Configure CMake
        run: |
          args=(-S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }})
          case "${{ runner.os }}" in
            Linux)
              args+=(-G Ninja -DCMAKE_C_COMPILER=${{ matrix.cc }} -DCMAKE_CXX_COMPILER=${{ matrix.cxx }})
              if [ "${{ matrix.coverage }}" == "true" ]; then args+=(-DENABLE_COVERAGE=ON); fi
              ;;
            Windows)
              if [ "${{ matrix.mingw }}" == "true" ]; then args+=(-G Ninja); fi
              ;;
            macOS)
              args+=(-DCMAKE_PREFIX_PATH="$(brew --prefix)")
              ;;
          esac
          cmake "${args[@]}"

      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }} --parallel

      # On Linux the tests run inside a virtual X server (Mesa software OpenGL),
      # so the rendering path is exercised as well as the simulation logic.
      - name: Run Tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a ctest --test-dir build --output-on-failure -C ${{ matrix.build_type }}

      - name: Run Tests
        if: runner.os != 'Linux'
        run: ctest --test-dir build --output-on-failure -C ${{ matrix.build_type }}

      - name: Generate and Check Coverage (Linux)
        if: matrix.coverage
        run: |
          gcovr -r .. . \
            --filter '^src/' \
            --exclude '.*/Main\.cpp' \
            --exclude-directories 'Dependencies' \
            --gcov-ignore-parse-errors \
            --print-summary \
            --fail-under-line 50
